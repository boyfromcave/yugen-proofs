[project]
name = "yugen-soundness"
version = "0.1.0"
description = "Yugen step 0.6: per-layer classical and QROM soundness calculator for the two proof systems, using proven bounds only."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
yugen-soundness = "yugen_soundness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yugen_soundness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
