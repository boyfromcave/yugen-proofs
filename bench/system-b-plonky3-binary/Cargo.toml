[package]
name = "yugen-bench-b-plonky3-binary"
version = "0.1.0"
edition = "2024"
publish = false
description = "Step 0.3 smoke benchmark: smallest Keccak-hashing proof in system B (Plonky3 native binary stack)."

[workspace]

[dependencies]
