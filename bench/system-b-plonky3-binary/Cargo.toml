p3-examples = { git = "https://github.com/Plonky3/Plonky3", rev = "fe5e46d755b8a7d9069778361e21b33e5978b377" }
p3-binary-field = { git = "https://github.com/Plonky3/Plonky3", rev = "fe5e46d755b8a7d9069778361e21b33e5978b377" }
p3-keccak-air = { git = "https://github.com/Plonky3/Plonky3", rev = "fe5e46d755b8a7d9069778361e21b33e5978b377" }
p3-sumcheck = { git = "https://github.com/Plonky3/Plonky3", rev = "fe5e46d755b8a7d9069778361e21b33e5978b377" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "fe5e46d755b8a7d9069778361e21b33e5978b377" }

[profile.release]
lto = "thin"
