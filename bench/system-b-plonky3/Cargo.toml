[package]
name = "yugen-bench-b-plonky3"
version = "0.1.0"
edition = "2024"
publish = false
description = "Step 0.3 smoke benchmark: smallest Keccak-hashing proof in system B (Plonky3, KoalaBear, FRI, Keccak)."

[workspace]

[dependencies]
# System B: Plonky3 (github.com/Plonky3/Plonky3), pinned to the published 0.9.0-rc.2 crates
# (git tag p3-*-v0.9.0-rc.2, commit fe5e46d755b8a7d9069778361e21b33e5978b377).
p3-challenger = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-keccak = "=0.9.0-rc.2"
p3-keccak-air = "=0.9.0-rc.2"
p3-koala-bear = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
rand = "0.10"
postcard = { version = "1", features = ["alloc"] }
serde = "1"

[profile.release]
lto = "thin"
